*{

html,body{
  margin:0;
  padding:0;
  background:#ffffff;
  color:#222222;
  font-family:"Segoe UI","Trebuchet MS",system-ui,-apple-system,sans-serif
}

h1,h2,h3,h4{
  color:#1A2F55
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

button:hover{
  filter:brightness(.97)
}

.hazard{
  background:repeating-linear-gradient(-45deg,#FFC107 0 14px,#2F5AA8 14px 28px)
}

.hazard-thin{
  background:repeating-linear-gradient(-45deg,#FFC107 0 9px,#2F5AA8 9px 18px)
}

.card{
  background:#ffffff;
  border:1px solid #C9D6EE;
  border-radius:14px;
  box-shadow:0 6px 22px rgba(47,90,168,.08)
}

.input{
  width:100%;
  background:#ffffff;
  color:#222222;
  border:1px solid #9FB3D6;
  border-radius:9px;
  padding:10px 11px;
  outline:none
}

.input:focus{
  border-color:#2F5AA8;
  box-shadow:0 0 0 3px rgba(47,90,168,.28)
}

.label{
  font-size:11px;
  letter-spacing:.11em;
  text-transform:uppercase;
  font-weight:800;
  color:#1A2F55;
  margin-bottom:5px;
  display:block
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:7px;
  justify-content:center;
  border-radius:9px;
  padding:10px 13px;
  font-weight:800;
  border:1px solid transparent;
  white-space:nowrap;
  cursor:pointer
}

.btn-yellow{
  background:#2F5AA8;
  color:#ffffff;
  border-color:#2F5AA8
}

.btn-yellow:hover{
  background:#264E90
}

.btn-dark{
  background:#456BAA;
  color:#ffffff;
  border-color:#456BAA
}

.btn-dark:hover{
  background:#3A5A90
}

.btn-ghost{
  background:#ffffff;
  color:#2F5AA8;
  border-color:#2F5AA8
}

.btn-ghost:hover{
  background:#E8EFFA
}

.btn-red{
  background:#C0392B;
  color:#ffffff;
  border-color:#C0392B
}

.btn-green{
  background:#1E7A34;
  color:#ffffff;
  border-color:#1E7A34

.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  padding:4px 8px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.02em;
  border:1px solid #C9D6EE;
  background:#E8EFFA;
  color:#1A2F55
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  background:#ffffff;
  color:#222222
}

.table th{
  text-align:left;
  padding:9px 10px;
  background:#2F5AA8;
  color:#ffffff;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase
}

.table td{
  padding:10px;
  border-bottom:1px solid #C9D6EE;
  vertical-align:top;
  background:#ffffff;
  color:#222222
}

.navbtn{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border-radius:10px;
  text-align:left;
  font-weight:700;
  color:#1A2F55;
  background:#ffffff;
  border:1px solid transparent;
  cursor:pointer
}

.navbtn:hover{
  background:#E8EFFA
}

.navbtn.active{
  background:#2F5AA8;
  color:#ffffff
}

.navbtn.active small{
  color:#ffffff
}

.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace
}

.scroll-thin::-webkit-scrollbar{
  height:6px;
  width:6px
}

.scroll-thin::-webkit-scrollbar-thumb{
  background:#9FB3D6;
  border-radius:99px
}

@media print{
  body{
    background:white
  }
}

.last\:border-0:last-child {
  border-width: 0px;
}

.hover\:bg-\[\#E8EFFA\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(232 239 250 / var(--tw-bg-opacity, 1));
}

.hover\:underline:hover {
  text-decoration-line: underline;
}

@media (min-width: 640px) {
  .sm\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .sm\:block {
    display: block;
  }

  .sm\:inline {
    display: inline;
  }

  .sm\:h-\[64px\] {
    height: 64px;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[11px\] {
    font-size: 11px;
  }
}

@media (min-width: 768px) {
  .md\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .md\:col-span-3 {
    grid-column: span 3 / span 3;
  }

  .md\:flex {
    display: flex;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .md\:grid-cols-\[170px_1fr_130px\] {
    grid-template-columns: 170px 1fr 130px;
  }
}

@media (min-width: 1024px) {
  .lg\:static {
    position: static;
  }

  .lg\:sticky {
    position: sticky;
  }

  .lg\:bottom-6 {
    bottom: 1.5rem;
  }

  .lg\:bottom-auto {
    bottom: auto;
  }

  .lg\:top-\[118px\] {
    top: 118px;
  }

  .lg\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .lg\:col-span-3 {
    grid-column: span 3 / span 3;
  }

  .lg\:block {
    display: block;
  }

  .lg\:flex {
    display: flex;
  }

  .lg\:hidden {
    display: none;
  }

  .lg\:w-\[260px\] {
    width: 260px;
  }

  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .lg\:bg-transparent {
    background-color: transparent;
  }

  .lg\:p-0 {
    padding: 0px;
  }

  .lg\:pb-6 {
    padding-bottom: 1.5rem;
  }
}

@media (min-width: 1280px) {
  .xl\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .xl\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
