<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soft Ice - Safeguard Pro (Rebuilt)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;background:radial-gradient(1100px 600px at 0% 0%,rgba(47,90,168,.22),transparent 60%),radial-gradient(900px 600px at 100% 15%,rgba(91,163,208,.20),transparent 60%),linear-gradient(180deg,#DCE8F8 0%,#EFF4FB 38%,#FFFFFF 70%,#E3ECF9 100%);background-attachment:fixed;color:#1A2F55;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#0A1E4A 0%,#1E3A6E 45%,#2F5AA8 80%,#3A6BC0 100%);color:#fff;padding:14px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 22px rgba(18,35,68,.25)}
.logo-blend{background:transparent;border-radius:0;padding:0;display:flex;align-items:stretch;gap:14px;box-shadow:none;max-width:96vw}
.logo-blend img.s-logo{height:130px;width:auto;object-fit:contain;display:block;background:transparent;border-radius:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.logo-divider{display:none}

header h1{font-family:Georgia,'Times New Roman',serif;font-size:22px;margin:0;letter-spacing:.3px}header p{margin:4px 0 0;font-size:12.5px;color:#EAF0FA}
nav{background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:9px 12px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.7);position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(18,35,68,.06)}
.g{position:relative}.gb{border:1px solid rgba(47,90,168,.25);background:rgba(255,255,255,.85);color:#1A2F55;padding:9px 15px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px;transition:all .18s ease}
.g.open .gb,.gb:hover{background:#2F5AA8;color:#fff;border-color:#2F5AA8;transform:translateY(-1px)}
.drop{position:absolute;top:calc(100% + 6px);left:0;min-width:235px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border:1px solid #D9E4F5;border-radius:14px;box-shadow:0 14px 30px rgba(18,35,68,.18);padding:6px;z-index:20;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .35s ease,transform .35s ease}
.g.open .drop{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.drop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 11px;cursor:pointer;font-size:14px;border-radius:9px;color:#1A2F55;font-family:inherit;transition:background .12s}
.drop button:hover{background:#EAF0FA}.drop button.on{background:#2F5AA8;color:#fff}
main{padding:18px;max-width:1150px;margin:auto}
.card{background:rgba(72,82,102,.78);backdrop-filter:blur(18px) saturate(1.1) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(18,35,68,.10),inset 0 1px 0 rgba(255,255,255,.9);color:#FFFFFF;transition:transform .15s ease,box-shadow .15s ease}
.card h2,.card h3,.kpi b{color:#FFFFFF}.card p,.card li{color:#E8EDF5}.card label{color:#C7D0DE}.card .small{color:#C7D0DE}
.card:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(18,35,68,.13)}
h2{font-family:Georgia,'Times New Roman',serif;color:#1A2F55;margin:0 0 8px;font-size:21px}h3{color:#2F5AA8;margin:12px 0 6px;font-size:15px}
.btn{background:#2F5AA8;color:#fff;border:0;padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:700;transition:all .15s}.btn:hover{background:#22407E;transform:translateY(-1px)}
.btn2{background:rgba(255,255,255,.9);color:#2F5AA8;border:2px solid #2F5AA8;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700}
.del{background:#C0392B;color:#fff;border:0;padding:6px 10px;border-radius:8px;cursor:pointer}
input,select,textarea{width:100%;padding:10px 11px;border:1.5px solid #C9D4E8;border-radius:11px;margin:4px 0;font-size:14px;background:rgba(255,255,255,.95);color:#1A2F55;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2F5AA8;box-shadow:0 0 0 3px rgba(47,90,168,.14)}
label{font-size:11px;font-weight:700;color:#3A4F77;text-transform:uppercase;letter-spacing:.5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
table{width:100%;border-collapse:separate;border-spacing:0;background:rgba(255,255,255,.9);border-radius:12px;overflow:hidden}th{background:#2F5AA8;color:#fff;padding:9px;text-align:left;font-size:13px}td{border-bottom:1px solid #E8EFFA;padding:9px;vertical-align:top;color:#1A2F55;background:rgba(255,255,255,.75)}
.kpi{background:rgba(72,82,102,.78);backdrop-filter:blur(16px) saturate(1.1);border:1px solid rgba(255,255,255,.85);border-left:5px solid #2F5AA8;border-radius:14px;padding:14px;box-shadow:0 6px 18px rgba(18,35,68,.08)}.kpi b{font-size:28px;color:#1A2F55;font-family:Georgia,serif}
.small{font-size:12px;color:#5A6B8A}.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.col{background:rgba(72,82,102,.78);backdrop-filter:blur(16px) saturate(1.1);border:1px solid rgba(255,255,255,.85);border-radius:14px;padding:12px}
.col h3{margin:0 0 10px}.kcard{background:rgba(255,255,255,.95);border:1px solid #D9E4F5;border-radius:11px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(18,35,68,.05)}
#toast{position:fixed;bottom:16px;right:16px;background:#1E7A34;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:99;box-shadow:0 6px 18px rgba(0,0,0,.2);font-weight:700}
img.thumb{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid #D9E4F5}
.plan{width:100%;height:auto;border:1px solid #D9E4F5;border-radius:12px;background:#fff}
@media(max-width:640px){.logo-blend{background:transparent;border-radius:0;padding:0;display:flex;align-items:stretch;gap:14px;box-shadow:none;max-width:96vw}.logo-blend img.s-logo{height:130px;width:auto;object-fit:contain;display:block;background:transparent;border-radius:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}header h1{font-size:18px}main{padding:12px}}

.kpi,.col{color:#FFFFFF}
.kpi .small,.col .small,.card .small{color:#D0D8E6}
.kpi b{color:#FFFFFF}
.col h3,.card h3{color:#FFFFFF}
.card p,.card li,.card td{color:#E8EDF5}
.card h2{color:#FFFFFF}
.kcard{color:#1A2F55}
.kcard .small{color:#5A6B8A}
nav .small{color:#1A2F55}
table td{color:#1A2F55}
table th{color:#fff}

.banner-text{height:130px;min-width:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#040C22 0%,#0A1E4A 28%,#142F68 50%,#2F5AA8 72%,#5BA3D0 100%);border-radius:18px;padding:0 28px;box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.35)}
.banner-soft{font-family:Georgia,'Times New Roman',serif;font-size:44px;font-weight:800;letter-spacing:3px;color:#fff;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.35);white-space:nowrap}
.banner-sub{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;letter-spacing:6px;color:#EAF0FA;margin-top:8px;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.3)}
</style></head><body>

function savePhoto(){var f=document.getElementById('f_photo').files[0];if(!f){alert('Choose a photo first');return}var r=new FileReader();r.onload=function(){DB.photos.push({cap:v('f_cap'),data:r.result});save();render()};r.readAsDataURL(f)}
function exportJSON(){var d=new Date();var name='soft-ice-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';var b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
function importBackup(){var f=document.getElementById('f_import').files[0];if(!f){alert('Choose a backup .json file first');return}var r=new FileReader();r.onload=function(){try{var data=JSON.parse(r.result);if(!data||typeof data!=='object')throw new Error('Not a backup');['audits','templates','incidents','actions','assets','hazards','risks','firstaid','certs','reminders','photos','notes'].forEach(function(k){if(!Array.isArray(data[k]))data[k]=[]});DB=data;save();render();alert('Backup imported - '+DB.audits.length+' audits, '+DB.incidents.length+' incidents, '+DB.actions.length+' actions restored.')}catch(e){alert('Could not import that file - it is not a valid Soft Ice backup.')}};r.readAsText(f)}
render();
</script></body></html>
